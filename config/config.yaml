device: auto  # "auto" chooses CUDA if available else CPU
seeds: [1, 2, 3]
budgets_B: [262144, 524288, 1048576]  # 0.25 / 0.5 / 1 MB

# ---------------------------------------------------------------------------
#  Dataset specifications used by all experiments
# ---------------------------------------------------------------------------
datasets:
  CIFAR100:
    url: https://www.cs.toronto.edu/~kriz/cifar-100-python.tar.gz
    train_size: 50000
    img_sz: 32
    tasks: 10
    classes_per_task: 10
  TinyIN:
    url: http://cs231n.stanford.edu/tiny-imagenet-200.zip
    train_size: 100000
    img_sz: 64
    tasks: 10
    classes_per_task: 20
  ImageNet100:
    url: https://github.com/ellisbrown/IN100/archive/refs/heads/main.zip
    train_size: 120000
    img_sz: 112
    tasks: 10
    classes_per_task: 10

optim:
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005

batch: 128

# All figures are written here so the CI system can collect them easily.
plots: .research/iteration20/images