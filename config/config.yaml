common:
  device: cuda if torch.cuda.is_available() else cpu
  deterministic: true
  fp16: false               # AMP disabled to remove FutureWarning
  seeds: [0,1]              # <-- set to 10 for real run; kept small for CI quota
  epochs: 400
  early_stop_patience: 25
  optimiser: {name: AdamW, weight_decay: 5e-4, eps: 1e-8}
  scheduler: {name: CosineAnnealingLR, min_lr: 1e-5, warmup: 10}
  batch_size: null          # full-batch by default
  print_every: 10
experiments:
  exp1:
    description: |
      Experiment-1  –  synthetic core vs chain benchmark verifying that APD learns
      node-adaptive depths that correlate (negatively) with degree and match the
      known ground-truth required propagation distance.
    dataset:
      name: synthetic_cc
      num_chains: 50
      chain_len: 800
      core_nodes: 5000
      core_p: 0.024
      noise_nodes: 25000
    models: [gcn_deep, gat_deep, gcnii, pairnorm_si, apd_gcn, apd_gat]
    hidden: 128