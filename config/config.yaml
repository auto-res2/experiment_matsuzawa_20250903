global:
  env:
    torch_version: 2.8.0
    torchvision_version: 0.23.0
    cuda: "12.8"
    gpu_name: Tesla-T4
  hardware:
    num_workers: 8
    amp: true
    grad_ckpt: true
    peak_mem_guard_gb: 14.5
  seeds:
  - 0
  - 1
  - 2

# ---------------- datasets ----------------
datasets:
  waterbirds:
    loader: wilds
    wilds_name: waterbirds
    url: https://huggingface.co/datasets/grodino/waterbirds
  celeba:
    loader: wilds
    wilds_name: celebA
    url: https://mmlab.ie.cuhk.edu.hk/projects/CelebA.html
  imagenet9:
    loader: imagenet9
    url: https://github.com/MadryLab/backgrounds_challenge/releases/download/data/backgrounds_challenge_data.tar.gz
  ninco:
    loader: ninco
    url: https://zenodo.org/record/8013288/files/NINCO_all.tar.gz?download=1
  coco_places:
    loader: coco_places
    url_script: https://raw.githubusercontent.com/anon/dica-robustness/main/scripts/build_coco_places.py

# -------------- backbones ------------------
backbones:
  resnet50:
    batch: 128
    optim:
      type: SGD
      lr: 0.03
      momentum: 0.9
      wd: 0.0005
  vit_b16:
    batch: 96
    optim:
      type: AdamW
      lr: 0.0003
      betas:
      - 0.9
      - 0.99
      wd: 0.05

schedule:
  epochs: 30
  patience: 5
  warmup_pct: 0.05

methods:
- erm
- irm
- groupdro
- gcdro
- autoacer
- cad
- dica

dica:
  top_p: 0.1
  k: 3
  lambda_consistency: 1.0
  alpha_gcdro: 0.1
  tau_clip_quality: 0.27

fig:
  dir: outputs/figures
