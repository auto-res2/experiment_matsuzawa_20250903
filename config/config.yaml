hardware:
  gpu: T4
  num_workers: 4
  amp: true
  grad_ckpt: true
seeds:
  - 0
  - 1
  - 2
datasets:
  waterbirds:
    loader: wilds
    wilds_name: waterbirds
    url: https://huggingface.co/datasets/grodino/waterbirds
  celeba:
    loader: wilds
    wilds_name: celebA
    url: http://mmlab.ie.cuhk.edu.hk/projects/CelebA.html
  imagenet9:
    loader: bgchallenge
    git: https://github.com/MadryLab/backgrounds_challenge.git
  ninco:
    loader: tar
    url: https://zenodo.org/record/8013288/files/NINCO.tar.gz
  coco_places:
    loader: compose
    coco_img: http://images.cocodataset.org/zips/val2017.zip
    coco_ann: http://images.cocodataset.org/annotations/annotations_trainval2017.zip
    places: http://data.csail.mit.edu/places/places365/val_256.tar
backbones:
  resnet50:
    batch: 128
    optim:
      type: SGD
      lr: 0.03
      momentum: 0.9
      wd: 0.0005
  vit_b16:
    batch: 96
    optim:
      type: AdamW
      lr: 0.0003
      betas:
        - 0.9
        - 0.99
      wd: 0.05
training:
  epochs: 30
  patience: 5
methods:
  - erm
  - irm
  - groupdro
  - gcdro
  - autoacer
  - cad
  - dica
dica:
  top_p: 0.1
  k: 3
  lambda_consistency: 1.0
  alpha_gcdro: 0.1
  tau_clip: 0.27
figures:
  dir: .research/iteration8/images
