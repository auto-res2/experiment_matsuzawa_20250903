common:
  device: auto         # "auto" ⇒ cuda if available else cpu
  deterministic: true
  fp16: false
  epochs: 400
  early_stop: 25
  print_every: 10
  optimiser:
    name: AdamW
    lr: 0.005
    weight_decay: 0.0005
    eps: 1e-08
  scheduler:
    name: CosineAnnealingLR
    min_lr: 1e-05
    warmup: 10
  seeds: [0, 1, 2]
experiments:
  exp1:
    dataset:
      name: synthetic_cc
      core_nodes: 5000
      core_p: 0.024
      num_chains: 50
      chain_len: 800
      noise_nodes: 25000
    models: [gcn_deep, gat_deep, gcnii, pairnorm_si, apd_gcn, apd_gat]
    hidden: 128
  exp2:
    datasets: [cora, citeseer, pubmed, cornell, texas, wisconsin, chameleon, squirrel, ogbn-arxiv, ogbn-products]
    models: [gcn_deep, gat_deep, gcnii, pairnorm_si, apd_gcn, apd_gat]
    hidden: 128
  exp3:
    early_exit_dataset: ogbn-products
    robustness_datasets: [cora, squirrel]
