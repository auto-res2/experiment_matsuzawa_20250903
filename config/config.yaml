device: "cuda"
seeds: [1, 2, 3]
budgets:
  small: 262144
  medium: 524288
  large: 1048576

datasets:
  CIFAR100:
    url: "https://www.cs.toronto.edu/~kriz/cifar-100-python.tar.gz"
    tasks: 10
    classes_per_task: 10
    img_size: 32
  TinyIN:
    url: "https://zenodo.org/records/10720917/files/tiny-imagenet-200.zip?download=1"
    tasks: 10
    classes_per_task: 20
    img_size: 64
  ImageNet100:
    url: "https://huggingface.co/datasets/lostboiii6/ImageNet100/resolve/main/ImageNet100.zip"
    tasks: 10
    classes_per_task: 10
    img_size: 112

optim:
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005

batch: 128
vqgan_ckpt: "vqgan_imagenet_f16_16384"
plots: ".research/iteration6/images"
